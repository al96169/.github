name: 功能建议
description: 提出一个新功能或对现有功能的改进
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        请优先描述**你要解决的问题**，而不只是期望的实现方式 —— 这有助于一起讨论出更合适的方案。
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的场景 / 问题
      description: 现在是什么体验？为什么不够用？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望它怎么工作？（可以是粗略想法）
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 有没有试过别的做法？为什么不行？
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 参考链接、草图、相关 Issue 等
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已检索过现有 Issue 与文档，确认不是已规划或已实现的功能
          required: true
